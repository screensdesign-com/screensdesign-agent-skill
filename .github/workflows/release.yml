name: Publish skill release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate and build the tagged skill
        run: >-
          python scripts/build_release.py
          --check
          --tag "${GITHUB_REF_NAME}"
          --output-dir dist

      - name: Publish immutable release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/screensdesign-data-${GITHUB_REF_NAME}.zip
          release.json
          --verify-tag
          --generate-notes
