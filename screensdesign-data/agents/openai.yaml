interface:
  display_name: "ScreensDesign Data"
  short_description: "Research apps, markets, reviews, and recorded UI"
  brand_color: "#0A84FF"
  default_prompt: "Use $screensdesign-data to find meditation competitors across the broader app market, summarize recurring review themes, and verify recorded onboarding evidence for apps available in the ScreensDesign library."

dependencies:
  tools:
    - type: "mcp"
      value: "screensdesign"
      description: "Hosted ScreensDesign MCP server authenticated with OAuth browser login"

policy:
  allow_implicit_invocation: true
